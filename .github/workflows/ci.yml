name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    # A throwaway Postgres for the schema-drift check below. Nothing here
    # touches the production database, and no secret is needed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: migrated
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Deliberately typecheck only — no `next build` here.
      #
      # Payload reads DATABASE_URI while the config is evaluated, so a build in
      # CI would need real database credentials as repository secrets, and the
      # only database this project has is production. Vercel already runs the
      # full build on every preview deployment, and next.config.mjs does not set
      # typescript.ignoreBuildErrors, so build breakage is caught there.
      #
      # What Vercel does NOT do is *block a merge*. That gate is this job's
      # entire job. tsconfig.json includes **/*.ts, so this covers src/,
      # scripts/ and src/scripts/ alike.
      - run: npm run typecheck

      # Unit tests over the pure helpers only — no database, no browser, so
      # this needs no secrets. Added after two bugs in readingTime survived
      # into production: it counted from the wrong node and could not count
      # Chinese. Both are covered now.
      - run: npm test

      # Message parity between en.json and zh.json, plus keys nothing reads.
      # The script predates this gate and was only ever run by hand, which is
      # why half the tech-debt table is i18n regressions: a hardcoded ternary
      # here, an English string on a Chinese page there. It needs no secrets
      # and runs in well under a second.
      #
      # A step rather than a second job, deliberately: branch protection
      # requires the check named `typecheck`, so a new job would run without
      # being able to block a merge.
      - run: npm run i18n:check

      # Do the migrations build the schema the collections define? For five
      # months they did not — dev-mode push kept production in step with the
      # configs while the migrations fell 26 differences behind (#46, #53),
      # and nothing compared the two. Builds one database from the migrations
      # and one by pushing the code's schema, then diffs them. A collection
      # change without a migration fails here. See scripts/schema-drift.ts.
      #
      # Steps in this job rather than a new one, for the same reason as the
      # i18n check: `typecheck` is the check branch protection requires.
      #
      # Both of the first two steps load payload.config.ts, which refuses to
      # start without PAYLOAD_SECRET. The value here signs nothing that
      # outlives the job: the databases go away with the runner. It is not a
      # repository secret, so Dependabot PRs get it too.
      - name: 'Schema drift: migrate'
        env:
          DATABASE_URI: postgresql://postgres:ci@localhost:5432/migrated
          NODE_ENV: production
          PAYLOAD_SECRET: ci-schema-drift-throwaway
        run: npx payload migrate
      - name: 'Schema drift: push the code schema'
        env:
          PUSHED_URI: postgresql://postgres:ci@localhost:5432/pushed
          NODE_ENV: development
          PAYLOAD_SECRET: ci-schema-drift-throwaway
        run: npx tsx scripts/schema-drift.ts push
      - name: 'Schema drift: compare'
        env:
          MIGRATED_URI: postgresql://postgres:ci@localhost:5432/migrated
          PUSHED_URI: postgresql://postgres:ci@localhost:5432/pushed
        run: npx tsx scripts/schema-drift.ts compare
