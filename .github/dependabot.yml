# Weekly dependency updates.
#
# Until this file, updates happened when someone thought to run
# `npm outdated`. That is how #64 found Next.js 16.3.6 (a critical RCE fix in
# next/og) and Payload 3.90 ("critical security fixes, upgrade as soon as
# possible") days after release, by chance.
#
# What a Dependabot PR still needs from a person:
#
# - Payload releases can add columns. CI's schema-drift check fails the PR
#   when they do ("code only: <table> | <column>"). Write the migration on
#   the PR branch (see src/migrations/ and #64) until CI passes, then run it
#   on production before merging: additive migrations are safe to run ahead
#   of the deploy, and the production build prerenders against the new
#   columns.
# - Read the release notes for anything marked security or breaking.
#
# Security fixes also arrive as Dependabot security updates once the repo's
# vulnerability alerts are on (GitHub → Settings → Code security).
#
# Version updates wait a week after a release (`cooldown` below). #139 picked
# "only versions released at least 7 days ago" by hand: a compromised or
# broken release is usually caught and yanked within days, and a week costs a
# personal site nothing. Security updates ignore the cooldown, so a fix for a
# published advisory is not held back. Reference:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#cooldown-
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Dependabot's own default is 3 days. Without include/exclude it applies to
    # every dependency, and it is judged per package: a group PR leaves out only the
    # members still inside their week. Majors are ignored below, so there is no
    # semver-major-days.
    cooldown:
      default-days: 7
    groups:
      # Every @payloadcms/* package pins payload to the exact same version, so
      # they can only move together; one at a time fails with ERESOLVE.
      payload:
        patterns:
          - payload
          - '@payloadcms/*'
      next:
        patterns:
          - next
          - next-intl
          - '@next/*'
          # Lint rules for the Next version in use; a mismatch lints against
          # rules the build does not run.
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      # Everything else, minor and patch only, in one PR a week.
      other:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Majors are their own project: TypeScript 7, GraphQL 17 (a Payload
      # peer) and the like need Payload and Next to support them first.
      # Security fixes land in the supported major and still come through.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    # Same week as npm. GitHub Actions only supports default-days (no
    # per-semver days); an action runs with this workflow's token, so a
    # hijacked release is as dangerous here as in npm.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
